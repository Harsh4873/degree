<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310" />
    <meta
      name="description"
      content="An editable, local-first planning canvas for the Texas A&M MS in Computer Science degree."
    />
    <link rel="icon" type="image/svg+xml" href="/degree/favicon.svg" />
    <link rel="canonical" href="https://harsh.bet/degree/" />
    <title>Degree Canvas · TAMU MSCS</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('degree-canvas-theme');
        if (storedTheme !== 'light' && storedTheme !== 'dark') {
          storedTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = storedTheme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
